name: Revenue Backend CI

on:
  push:
    branches:
      - feat/hoptym-revenue-backend
      - feat/google-ai-studio-recovery
  pull_request:
    branches:
      - main
      - feat/supabase-auth-protected-app
      - feat/revenue-ui-api-integration

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Revenue domain tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Revenue Edge Function typecheck
        run: deno check supabase/functions/revenue-api/index.ts
      - name: Production build
        run: npm run build
